<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار الأحياء - الفصل الأول (الخلية)</title>
    <!-- Tailwind CSS for Modern Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Link to Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-50 bg-white shadow-md border-b border-slate-200">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <i class="fa-solid font-bold text-2xl text-blue-600 fa-dna"></i>
                <h1 class="text-xl font-bold text-slate-800">اختبار الفصل الأول: الخلية</h1>
            </div>
            <!-- Timer Badge -->
            <div id="timer-container" class="flex items-center space-x-2 space-x-reverse bg-amber-50 text-amber-700 border border-amber-200 px-4 py-1.5 rounded-full font-bold text-lg shadow-sm">
                <i class="fa-regular fa-clock text-amber-600 animate-pulse"></i>
                <span id="timer">40:00</span>
            </div>
        </div>
        <!-- Progress Bar -->
        <div class="w-full bg-slate-200 h-2">
            <div id="progress-bar" class="bg-blue-600 h-2 transition-all duration-300 w-0"></div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-4xl mx-auto w-full px-4 py-8 flex-grow">

        <!-- Welcome/Start Screen -->
        <div id="start-card" class="bg-white rounded-2xl shadow-xl p-8 text-center border border-slate-100">
            <div class="w-20 h-20 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <h2 class="text-2xl font-bold mb-4 text-slate-800">مرحباً بك في اختبار الأحياء الشامل</h2>
            <p class="text-slate-600 mb-6 leading-relaxed max-w-xl mx-auto">
                يحتوي هذا الاختبار على 50 سؤالاً اختيار من متعدد تغطي مواضيع الفصل الأول (الخلية). الوقت المحدد للامتحان هو <strong>40 دقيقة</strong>.
            </p>
            <div class="flex flex-wrap justify-center gap-4 mb-8 text-sm font-semibold text-slate-500">
                <span class="bg-slate-100 px-4 py-2 rounded-lg border border-slate-200"><i class="fa-regular fa-file-lines ml-2 text-blue-500"></i>50 سؤال</span>
                <span class="bg-slate-100 px-4 py-2 rounded-lg border border-slate-200"><i class="fa-regular fa-clock ml-2 text-amber-500"></i>40 دقيقة</span>
                <span class="bg-slate-100 px-4 py-2 rounded-lg border border-slate-200"><i class="fa-solid fa-check-double ml-2 text-emerald-500"></i>تصحيح تلقائي</span>
            </div>
            <button id="start-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-lg px-10 py-3.5 rounded-xl shadow-lg hover:shadow-blue-200 transition-all transform hover:-translate-y-0.5">
                بدء الاختبار الآن
            </button>
        </div>

        <!-- Quiz Screen (Hidden by Default) -->
        <div id="quiz-card" class="hidden space-y-6">
            <!-- Questions Container -->
            <div id="questions-container" class="space-y-6"></div>

            <!-- Submit Button Footer -->
            <div class="bg-white rounded-xl shadow-md p-4 border border-slate-200 flex justify-between items-center sticky bottom-4 z-40">
                <span id="answered-count" class="text-sm font-semibold text-slate-600">الأجوبة الإجمالية: 0 / 50</span>
                <button id="submit-btn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-8 py-3 rounded-lg shadow-md transition-all">
                    إنهاء الامتحان وتسليم الأجوبة
                </button>
            </div>
        </div>

        <!-- Results Screen (Hidden by Default) -->
        <div id="result-card" class="hidden bg-white rounded-2xl shadow-xl p-8 text-center border border-slate-100">
            <div id="result-icon-container" class="w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl"></div>
            <h2 id="result-title" class="text-3xl font-extrabold mb-2"></h2>
            <p id="result-subtitle" class="text-slate-500 mb-6 font-medium"></p>
            
            <div class="bg-slate-50 border border-slate-200 rounded-2xl p-6 max-w-md mx-auto mb-8 grid grid-cols-2 gap-4">
                <div>
                    <span class="block text-xs font-semibold text-slate-400 uppercase">الدرجة النهائية</span>
                    <span id="final-score" class="text-3xl font-bold text-blue-600">0 / 50</span>
                </div>
                <div>
                    <span class="block text-xs font-semibold text-slate-400 uppercase">النسبة المئوية</span>
                    <span id="final-percentage" class="text-3xl font-bold text-blue-600">0%</span>
                </div>
            </div>

            <div class="flex justify-center gap-4">
                <button id="review-btn" class="bg-slate-800 hover:bg-slate-900 text-white font-semibold px-6 py-3 rounded-xl transition-all">
                    مراجعة الإجابات التفصيلية
                </button>
                <button id="restart-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-xl transition-all">
                    إعادة الامتحان
                </button>
            </div>
        </div>

    </main>

    <!-- Link to External Script JS -->
    <script src="script.js"></script>
</body>
</html>
